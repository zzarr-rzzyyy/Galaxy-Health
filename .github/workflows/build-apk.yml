name: Build MEDRATE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract MEDRATE.zip and locate project
        run: |
          set -e
          test -f MEDRATE.zip || { echo "MEDRATE.zip not found at repo root"; exit 1; }
          mkdir -p _extracted
          unzip -q MEDRATE.zip -d _extracted
          SETTINGS=$(find _extracted -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle.kts not found"; exit 1; }
          DIR=$(dirname "$SETTINGS")
          test -d "$DIR/app" || { echo "app/ folder not found next to settings.gradle.kts"; exit 1; }
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found at: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9 (no wrapper in project)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
        shell: bash -o pipefail {0}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medrate-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
